appId: dev.cross-tts.app
productName: Cross TTS
copyright: Cross TTS
# Overrides the package.json description for build metadata, including the
# Windows exe FileDescription (the name shown in Task Manager).
extraMetadata:
  description: Cross TTS

directories:
  output: release
  buildResources: assets

# electron-vite emits main/preload/renderer here; package.json is needed for asar.
files:
  - out/**
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,*.flow,*.mk,*.d.ts,*.map}"
  # transformers' default model cache; fills up on dev machines (hundreds of MB).
  - "!**/node_modules/@huggingface/transformers/.cache/**"
  # The renderer bundles the ORT wasm/glue it uses into out/renderer; the
  # package itself (~140 MB of dist variants) is never loaded at runtime.
  - "!**/node_modules/onnxruntime-web/**"
  # Same for phonon-tts (its worker and wasm builds are bundled by Vite); only
  # its licence files ship.
  - "!**/node_modules/phonon-tts/!(LICENSE-APACHE|LICENSE-MIT|THIRD_PARTY_LICENSES.md)"
  # onnxruntime-node: never ship the CUDA/TensorRT execution providers. npm
  # doesn't include them (a dev checkout only has them after an explicit
  # `ONNXRUNTIME_NODE_INSTALL=cuda12` install); they are ~hundreds of MB and the
  # opt-in CUDA setting expects the user to provide CUDA 12 + cuDNN 9 and the
  # provider libraries. Without them the native engine logs why and uses CPU.
  # The binding links libonnxruntime.so.1 / @rpath/libonnxruntime.1.dylib, so
  # the full-version copies are duplicates (~45 MB each).
  - "!**/node_modules/onnxruntime-node/bin/**/{libonnxruntime_providers_cuda.so,libonnxruntime_providers_shared.so,libonnxruntime_providers_tensorrt.so,onnxruntime_providers_cuda.dll,onnxruntime_providers_shared.dll,onnxruntime_providers_tensorrt.dll,libonnxruntime.so.1.*,libonnxruntime.1.*.dylib}"
  # ...and only the architecture being packaged. ${arch} is expanded per build
  # arch (x64 / arm64), so the extglob drops every *other* arch's directory and
  # never the one this target needs. (onnxruntime-node >= 1.2x ships napi-v6
  # only, and no darwin/x64 build: Intel Macs fall back to the WASM engine.)
  - "!**/node_modules/onnxruntime-node/bin/napi-v6/*/!(${arch})/**"
  # main/utility only load dist/transformers.node.cjs; the web builds are dead
  # weight (Vite bundles what the renderer needs into out/renderer).
  - "!**/node_modules/@huggingface/transformers/dist/!(transformers.node.cjs)"

asar: true
npmRebuild: false

# Turn the packaged binary into "only this app", not a general Node/Electron
# interpreter: no ELECTRON_RUN_AS_NODE, no NODE_OPTIONS, no --inspect, and no
# loading code from outside app.asar. The TTS worker uses utilityProcess.fork,
# which starts a Chromium utility process and doesn't need RunAsNode.
# electron-builder flips these right before signing.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  # Mac builds are unsigned (CSC_IDENTITY_AUTO_DISCOVERY=false in release.yml),
  # and flipping fuses invalidates the arm64 ad-hoc signature: re-sign ad hoc.
  # Only acts on .app bundles, so Windows/Linux are unaffected.
  resetAdHocDarwinSignature: true

# onnxruntime-node's native libraries can't be loaded from inside the asar.
asarUnpack:
  - "**/node_modules/onnxruntime-node/**"
  # sharp (imported at top level by transformers in the TTS worker): its .node
  # is auto-unpacked but finds libvips via a relative RUNPATH into
  # @img/sharp-libvips-*, which must sit next to it outside the asar.
  - "**/node_modules/@img/**"
# Tells electron-updater where to look for new versions (embedded as
# app-update.yml). CI still uploads assets manually (--publish never); this only
# configures the update feed, it does not publish.
publish:
  provider: github
  owner: Emad-K
  repo: cross-tts

# Consistent, space-free names with version + arch for every target.
artifactName: ${name}-${version}-${arch}.${ext}

# onnxruntime-node ships native binaries for every OS (~100+ MB each); keep
# only the target platform's out of each installer.
win:
  files:
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/{darwin,linux}/**"
  icon: assets/windows/icon_256x256.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup-${arch}.${ext}

portable:
  artifactName: ${name}-${version}-portable-${arch}.${ext}

mac:
  files:
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/{win32,linux}/**"
  icon: assets/icon.iconset
  category: public.app-category.productivity
  # Electron 38+ (Chromium 138+) no longer runs on macOS 11; make Finder say so.
  minimumSystemVersion: "12.0"
  # electron-updater on macOS installs from the zip (Squirrel.Mac can't use a
  # dmg), so ship both: dmg for first install, zip for auto-update. The zip
  # only installs once these builds are signed; until then autoUpdate.ts only
  # checks on macOS and points the user at the releases page.
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

linux:
  files:
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/{darwin,win32}/**"
    # Our Linux targets are glibc-only; sharp's musl (Alpine) builds never load.
    - "!**/node_modules/@img/*-linuxmusl-*/**"
  icon: assets/linux/icon_256x256.png
  category: AudioVideo
  maintainer: Emad Kazemi <emadkazemi310@gmail.com>
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64

# Custom deb maintainer scripts. These REPLACE electron-builder's default
# after-install/after-remove templates (so the scripts reproduce that default
# work) and add an AppArmor profile granting user namespaces — without it the
# app fails to launch on Ubuntu 24.04+, where unprivileged userns is restricted
# and Electron's sandbox needs it. See assets/linux/deb-after-install.sh.
# Keep the profile: it is what lets the renderer sandbox start at all. The
# userns grant is scoped to this binary, and the fuses above stop that binary
# from being reused as a generic Node interpreter (RunAsNode / NODE_OPTIONS /
# --inspect), which is the main way the grant could be borrowed.
deb:
  afterInstall: assets/linux/deb-after-install.sh
  afterRemove: assets/linux/deb-after-remove.sh

# Same profile for rpm (openSUSE and other AppArmor rpm distros). The install
# script only writes it when /etc/apparmor.d and apparmor_parser exist, so it
# is a no-op on SELinux distros like Fedora. rpm needs its own remove script:
# its upgrade order differs from dpkg's (see rpm-after-remove.sh).
rpm:
  afterInstall: assets/linux/deb-after-install.sh
  afterRemove: assets/linux/rpm-after-remove.sh
