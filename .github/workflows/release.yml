name: Release

# Releases are driven entirely by package.json's version: when a push to main
# carries a version that has no matching `v<version>` tag yet, this workflow
# builds all three OSes and publishes a GitHub Release (creating the tag in the
# process). There is no separate manual `git tag` step to forget — bumping the
# version in a merged PR *is* the release action. `workflow_dispatch` is the
# manual escape hatch (re-run a release for the current version).
#
# Flow: detect -> draft (create/reuse a draft release) -> build (each OS
# uploads its installers straight to the draft) -> publish (un-draft).
# Nothing goes through Actions artifact storage: ~3 GB per release, billed as
# GB-hours, previously exhausted the monthly storage quota and blocked builds.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; jobs that touch the release opt in to write access.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Silence the Node 20 deprecation; run JS actions on Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Gate every release on "package.json version is not yet tagged". Unchanged
  # version -> tag exists -> no-op, so ordinary pushes to main cost one cheap
  # job and nothing more. A draft release does not create its tag, so a failed
  # run leaves the version untagged and the next push/dispatch retries it.
  detect:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already tagged — nothing to release."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION has no tag yet — building and publishing."
          fi

  draft:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Pick the previous release by version order, not git ancestry. Release
      # tags have historically landed off main's lineage (squash-merges), so
      # GitHub's auto "previous tag" detection walks back to v1.0.0 and dumps
      # every PR into the notes. The current version isn't tagged yet, so the
      # newest existing tag *is* the prior release.
      #
      # A draft left by an earlier failed run is reused (retargeted to this
      # commit); build legs overwrite its assets with --clobber.
      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Draft v$VERSION already exists — reusing it."
            gh release edit "v$VERSION" --target "$GITHUB_SHA"
            exit 0
          fi
          PREV=$(git tag --sort=-v:refname | head -1)
          echo "Previous release tag: ${PREV:-<none>}"
          ARGS=(--draft --title "v$VERSION" --target "$GITHUB_SHA" --generate-notes)
          if [ -n "$PREV" ]; then
            ARGS+=(--notes-start-tag "$PREV")
          fi
          gh release create "v$VERSION" "${ARGS[@]}"

  # Residual tradeoff: job-level contents: write is needed so each leg can
  # upload straight to the draft (avoiding the Actions storage quota). The
  # token is only exposed to the final upload step and is not persisted in
  # .git/config, but a malicious dependency run by `pnpm install` could still
  # tamper with later steps via $GITHUB_PATH/$GITHUB_ENV. Such a dependency
  # would already ship inside the installers, so splitting the upload into a
  # separate job would cost artifact storage for little real gain.
  build:
    needs: [detect, draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Typecheck + unit tests are platform-independent, so they run once on
      # the Linux leg instead of three times. A failure there still blocks the
      # release: publish needs every build leg to succeed.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: runner.os == 'Linux'
      - run: pnpm run typecheck
        if: runner.os == 'Linux'
      - run: pnpm run test
        if: runner.os == 'Linux'

      - run: pnpm run build

      - name: Install rpm tooling (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Package
        run: pnpm exec electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # Straight to the draft release, no Actions artifact in between. Every OS
      # emits distinct file names (latest.yml = Windows, latest-mac.yml,
      # latest-linux.yml, latest-linux-arm64.yml; installers carry arch/target
      # in the name), so --clobber only replaces this leg's own files from a
      # previous attempt, never another leg's.
      - name: Upload to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          shopt -s nullglob
          files=(release/*.AppImage release/*.deb release/*.rpm release/*.exe \
                 release/*.dmg release/*.zip release/latest*.yml release/*.blockmap)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installers found under release/"
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          gh release upload "v$VERSION" "${files[@]}" --clobber

  # Runs only if every build leg succeeded (default `needs` semantics), so a
  # half-built release stays a draft. Un-drafting creates the v$VERSION tag at
  # the draft's target commit, which is what the next `detect` looks for.
  publish:
    needs: [detect, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
