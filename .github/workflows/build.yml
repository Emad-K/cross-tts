name: Build

# PR gate only. Installers are built by release.yml, never here: packaging
# three OSes on every PR and every merge cost ~30 runner-minutes (macOS bills
# 10x, Windows 2x) to produce files nobody downloaded. One Linux job covers
# typecheck, unit tests, the electron-vite build, the Electron e2e smoke and
# an unpacked Linux package build.
# No push-to-main trigger: the PR run already validated the merged code, and
# release.yml owns main.
on:
  pull_request:
    branches: [main, master]
    # Docs-only changes can't break the build. electron-builder.yml and
    # assets/linux are packaging inputs, so they are deliberately NOT ignored.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "llms.txt"
      - "assets/icon.iconset/**"
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Silence the Node 20 deprecation; run JS actions on Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build renderer + main + preload
        run: pnpm run build

      # Playwright drives the *built* Electron app (out/main/index.js) under
      # Xvfb and opens a CRLF EPUB fixture — the class of bug that passes
      # happy-dom unit tests but breaks read-along offsets in real Chromium.
      # Electron ships its own browser binary, so no `playwright install` is
      # needed; only Xvfb for a display. Reuses the build from the step above.
      - name: Ensure Xvfb is available
        run: command -v xvfb-run >/dev/null || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: E2E smoke (Playwright + Electron)
        run: xvfb-run --auto-servernum -- pnpm run test:e2e

      # Packaging smoke: electron-builder config, file filters and per-arch
      # native binaries otherwise first run in release.yml, after the version
      # bump is on main. Unpacked Linux dirs only (~1 min); Windows and macOS
      # packaging still only run at release.
      - name: Package smoke (Linux x64 + arm64, unpacked)
        run: |
          pnpm exec electron-builder --linux dir --x64 --arm64 --publish never
          test -d release/linux-arm64-unpacked/resources/app.asar.unpacked/node_modules/@img/sharp-linux-arm64

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          retention-days: 3
          path: test-results/
          if-no-files-found: ignore
